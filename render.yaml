services:
  - type: web
    name: projecttrack-ug
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate --no-input && python manage.py create_superadmin --username "$SUPERADMIN_USERNAME" --password "$SUPERADMIN_PASSWORD" && gunicorn school_projects.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: SUPERADMIN_USERNAME
        value: superadmin
      - key: SUPERADMIN_PASSWORD
        value: Admin12345!
      - key: DATABASE_URL
        fromDatabase:
          name: projecttrack-ug-db
          property: connectionString

databases:
  - name: projecttrack-ug-db
    plan: free
