{% extends "base.html" %}

{% block title %}Password changed · ProjectTrack UG{% endblock %}

{% block hero %}
  <div>
    <h1 class="h4 mb-1">Password updated</h1>
    <div class="text-muted">Your password has been changed successfully</div>
  </div>
{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-12 col-md-7 col-lg-6">
      <div class="card">
        <div class="card-body p-4">
          <p class="mb-3">You can continue using the app with your new password.</p>
          <a class="btn btn-success" href="{% url 'home' %}">Back to dashboard</a>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
